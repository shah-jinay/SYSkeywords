[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "resume-tailor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tailor = "tailor.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tailor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
